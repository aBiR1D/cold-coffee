version: 2

sources:
  - name: raw
    description: Raw source data ingested from production databases
    tables:
      - name: events
        description: User interaction events from the application
        columns:
          - name: user_id
            description: Unique identifier for the user
            tests:
              - not_null
          - name: event_type
            description: Category of the event (click, page_view, purchase, etc.)
            tests:
              - not_null
          - name: timestamp
            description: UTC timestamp when the event occurred
            tests:
              - not_null

      - name: customers
        description: Customer master data from the CRM
        columns:
          - name: customer_id
            description: Unique identifier for the customer
            tests:
              - not_null
              - unique
          - name: name
            description: Full name of the customer
          - name: email
            description: Primary email address
            tests:
              - not_null
          - name: tier
            description: Customer tier (free, pro, enterprise)
            tests:
              - not_null
              - accepted_values:
                  values: ['free', 'pro', 'enterprise']
          - name: updated_at
            description: Timestamp of the last update to this record
            tests:
              - not_null

models:
  - name: incremental_events
    description: >
      Deduplicated, incrementally-loaded user events with a 3-day lookback
      window to handle late-arriving data. Uses surrogate keys for 
      deduplication and fails loudly on schema changes.
    columns:
      - name: event_key
        description: Surrogate key generated from user_id + event_type + timestamp
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
      - name: event_date
        description: Date extracted from timestamp, used for partitioning
        tests:
          - not_null

  - name: scd_type2_customers
    description: >
      Type 2 Slowly Changing Dimension tracking historical changes to 
      customer tier and email. Current records have effective_to = '9999-12-31'.
    columns:
      - name: customer_surrogate_key
        description: Surrogate key for each version of a customer record
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: effective_from
        tests:
          - not_null
      - name: effective_to
        tests:
          - not_null
      - name: is_current
        description: Boolean flag indicating if this is the active record
        tests:
          - not_null
